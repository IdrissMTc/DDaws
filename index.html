.note{text-align:center;font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin:26px auto 0;max-width:520px}
.quiz{background:var(--surface);padding:clamp(20px,4vw,36px);display:grid;gap:18px;justify-items:center;text-align:center}

.qo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;width:100%;max-width:760px}

@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .p{padding-top:24px}.about{grid-template-columns:1fr}.about .arch{max-width:240px}.book{grid-template-columns:1fr}.pol div{border-left:0;border-top:1px solid var(--ink);padding-top:20px}.pol div:first-child{border-top:0;padding-top:0}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const PH=[['plaid','Sheer pink plaid short nails',['art']],['tort','Brown tortoise shell nails',['shimmer']],['blackfr','Black French tips with chrome glitter',['french','shimmer']],['cow','Cow print, burgundy and star nail art',['art']],['blue','Long baby blue almond nails',['long']],['leo','Leopard French tips with a charm',['french','art']],['gold','Nude nails with black and gold French tips',['french']],['flower','Black almond nails with purple florals',['art','long']],['zebra','Zebra print French tips',['french','art']]];
const el=id=>document.getElementById(id);
let lang='en',filter='all',path=['start'],res=null;
try{const s=localStorage.getItem('dc-lang');if(s)lang=s;else if((navigator.language||'').toLowerCase().startsWith('es'))lang='es'}catch(e){if((navigator.language||'').toLowerCase().startsWith('es'))lang='es'}
const t=k=>T[lang][k];
function galHTML(list){return list.map(p=>`<button type="button" data-p="${p[0]}" aria-label="${p[1]}"><img src="${IMG[p[0]]}" alt="${p[1]}" loading="lazy"></button>`).join('')}
function renderAll(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(n=>{const v=t(n.dataset.t);if(typeof v==='string')n.textContent=v});
 document.querySelectorAll('[data-img]').forEach(n=>n.src=IMG[n.dataset.img]);
 el('lang').textContent=lang==='en'?'ES':'EN';el('lang').setAttribute('aria-label',lang==='en'?'Cambiar a español':'Switch to English');
 el('hours').innerHTML=t('days').map((d,i)=>{const h=t('hrs')[i];return `<div class="${h?'':'cl'}"><span>${d}</span><span>${h||t('closed')}</span></div>`}).join('');
 el('gal-home').innerHTML=galHTML(PH.slice(0,6));
 el('chips').innerHTML=Object.entries(t('filters')).map(([k,v])=>`<button type="button" data-f="${k}" class="${k===filter?'on':''}">${v}</button>`).join('');
 el('gal').innerHTML=galHTML(PH.filter(p=>filter==='all'||p[2].includes(filter)));
 el('menu').innerHTML=t('g').map((g,gi)=>`<div class="grp"><span class="ser">${g}</span><div class="list">${SV.filter(s=>s[0]===gi).map(s=>{const d=t('svcD')[s[1]];return `<div class="svc"><h3>${s[1]}</h3><span class="m">${t('tm')(s[2])} · $${s[3]}</span>${d?`<p class="d">${d}</p>`:''}<button type="button" class="btn b" data-s="${s[1]}">${t('book')}</button></div>`}).join('')}</div></div>`).join('');
 el('addons').innerHTML=t('ad').map((a,i)=>`<div><span>${a}</span><b>+$${AD[i]}</b></div>`).join('');
 el('faq').innerHTML=t('faq').map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('');
 el('pol').innerHTML=t('pol').map(p=>`<div>${ICON[p[0]]}<b>${p[1]}</b><p>${p[2]}</p></div>`).join('');
 el('prep').innerHTML=t('prep').map(p=>`<li>${ICON.ok}${p}</li>`).join('');
 const cur=el('sv').value;el('sv').innerHTML=SV.map(s=>`<option value="${s[1]}">${s[1]} (${t('tm')(s[2])}, $${s[3]})</option>`).join('');if(cur)el('sv').value=cur;
 el('tm').innerHTML=t('times').map(x=>`<option>${x}</option>`).join('');
 renderQuiz();
}
function renderQuiz(){const q=el('quiz');
 if(res){const s=SV.find(x=>x[1]===res.s);q.innerHTML=res.m?`<p class="q" style="max-width:30ch;margin:0 auto">${t('qMsg')}</p><div class="row" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="https://www.instagram.com/d_clawss">Instagram</a><button class="qback" type="button" data-q="restart">${t('qRestart')}</button></div>`:
 `<div class="res"><span class="lab">${t('findT')}</span><h3>${s[1]}</h3><span class="m">${t('tm')(s[2])} · $${s[3]}</span>${res.n?`<p>${res.n}</p>`:''}${t('svcD')[s[1]]&&!res.n?`<p style="color:var(--muted);font-size:.92rem">${t('svcD')[s[1]]}</p>`:''}<button class="btn" type="button" data-s="${s[1]}">${t('qBook')}</button></div><button class="qback" type="button" data-q="restart">${t('qRestart')}</button>`;return}
 const n=path[path.length-1],d=t('q')[n];
 q.innerHTML=`<span class="lab">${t('findLab')}</span><p class="q">${d[0]}</p><div class="qo">${d[1].map((o,i)=>`<button type="button" data-o="${i}">${o[0]}</button>`).join('')}</div>${path.length>1?`<button class="qback" type="button" data-q="back">${t('qBack')}</button>`:''}`}
function openLb(k){const p=PH.find(x=>x[0]===k);el('lbi').src=IMG[k];el('lbi').alt=p[1];el('lbc').textContent=p[1];el('lb').hidden=false;el('lbx').focus()}
function closeLb(){el('lb').hidden=true}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-s]');if(g){el('sv').value=g.dataset.s;location.hash='book';return}
 const p=e.target.closest('[data-p]');if(p){openLb(p.dataset.p);return}
 if(e.target.closest('#lbx')||e.target===el('lb')){closeLb();return}
 const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;renderAll();return}
 const o=e.target.closest('[data-o]');if(o){const opt=t('q')[path[path.length-1]][1][+o.dataset.o][1];const [k,v]=[opt.slice(0,1),opt.slice(2)];if(k==='n')path.push(v);else if(k==='m')res={m:1};else{const [s,n]=v.split('|');res={s,n}}renderQuiz();return}
 const qq=e.target.closest('[data-q]');if(qq){if(qq.dataset.q==='back')path.pop();else{path=['start'];res=null}renderQuiz();return}
 if(e.target.closest('#lang')){lang=lang==='en'?'es':'en';try{localStorage.setItem('dc-lang',lang)}catch(x){}renderAll();return}
 if(e.target.closest('#mb')){const n=el('nav');const o=n.classList.toggle('open');el('mb').setAttribute('aria-expanded',o);return}
 if(e.target.closest('nav a'))el('nav').classList.remove('open');
 const gq=e.target.closest('[data-go="quiz"]');if(gq){setTimeout(()=>el('quiz').scrollIntoView({behavior:'smooth',block:'center'}),60)}
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
const P=['home','gallery','services','book'];
function route(){let h=location.hash.slice(1);if(!P.includes(h))h='home';P.forEach(x=>el('p-'+x).hidden=x!==h);document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===h));el('bar').hidden=h==='book';el('nav').classList.remove('open');scrollTo(0,0)}
addEventListener('hashchange',route);renderAll();route();
el('f').addEventListener('submit',e=>{e.preventDefault();el('ok').hidden=false;e.target.reset()});
</script>
